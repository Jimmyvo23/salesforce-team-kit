<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salesforce Team Workflow Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{--bg:#f3f4f8;--surface:#fff;--fg:#1c1d2b;--muted:#5d6176;--line:#e1e3ec;--accent:#5a4fcf;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px)) 48px}
  .wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
  header h1{font-size:24px;margin:0}
  header p{margin:2px 0 0;color:var(--muted)}
  .main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:900px){.main{grid-template-columns:1fr}}
  .stage{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#cde}
  .stage svg{display:block;width:100%;height:auto}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0}
  .clock{display:flex;align-items:baseline;gap:10px}
  .clock b{font-size:26px;font-variant-numeric:tabular-nums}
  .clock span{color:var(--muted);font-weight:600}
  .step-no{font:500 12px var(--mono);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
  .panel h2{margin:0;font-size:19px;line-height:1.25}
  .panel p{margin:0}
  .who{display:flex;flex-wrap:wrap;gap:6px}
  .who i{font-style:normal;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;color:#fff}
  .cmd{font:12.5px/1.5 var(--mono);background:#161a2e;color:#cfe3ff;border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre}
  .cmd .c{color:#7d88b5}
  .cmd .bad{color:#ff8a9b}
  .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl button{font:600 13px Inter,system-ui,sans-serif;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
  .ctl button.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:84px}
  .ctl button:focus-visible,.dots button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .dots{display:flex;flex-wrap:wrap;gap:5px}
  .dots button{width:22px;height:8px;border-radius:4px;border:0;background:#d6d8e4;cursor:pointer;padding:0}
  .dots button.done{background:#a9a2ef}.dots button.on{background:var(--accent);width:34px}
  .lower{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
  @media (max-width:900px){.lower{grid-template-columns:1fr}}
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .col{background:#f6f7fb;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:92px}
  .col h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:6px 8px;font-size:12.5px;line-height:1.3;transition:all .4s}
  .card b{display:block;font-size:12px}
  .card small{color:var(--muted)}
  .files{list-style:none;margin:0;padding:0;display:grid;gap:4px;font:12px/1.4 var(--mono)}
  .files li{display:flex;gap:6px;align-items:baseline;min-width:0}
  .files li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .files li.new{color:var(--accent);font-weight:600}
  .files li i{font-style:normal;flex:none;width:8px;height:8px;border-radius:2px;margin-top:3px}
  .bar{height:6px;border-radius:3px;background:#e6e7ef;overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width 1s ease}
  .bar.full>i{background:#2e9d57}
  .card .pc{display:flex;justify-content:space-between;font-size:11.5px;margin-top:4px;color:var(--muted)}
  .card .pc b{display:inline;font-size:11.5px;color:var(--fg);font-variant-numeric:tabular-nums}
  .tprog{display:grid;gap:2px;font-size:13px;color:var(--muted)}
  .tprog b{color:var(--fg);font-variant-numeric:tabular-nums}
  .sec-title{font-size:13px;font-weight:700;margin:0 0 6px}
  .typing{animation:type .5s ease-in-out infinite alternate}@keyframes type{to{transform:translateY(-1.2px)}}
  .blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
  .bob{animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-2.5px)}}
  .drift{animation:drift 30s linear infinite}@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
  .float{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-4px)}}
  .twinkle{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
  .pop{animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}.pulse-fast{animation:pulse .9s ease-in-out infinite}.pulse-slow{animation:pulse 3.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}
  .kb{animation:kb .22s steps(2) infinite}@keyframes kb{50%{opacity:.15}}
  @media (prefers-reduced-motion: reduce){.typing,.blink,.bob,.drift,.float,.twinkle,.pop,.pulse,.pulse-fast,.pulse-slow,.kb{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>One task, start to finish</h1>
    <p>Demo with made-up data: the Salesforce team takes request T-012 from your message to production in one day. Press Play, or step through with the arrows.</p>
  </header>
  <div class="main">
    <div class="stage" id="stage" role="img" aria-label="The team's office"></div>
    <div class="panel" aria-live="polite">
      <div class="clock"><b id="clk">08:45</b><span id="mood"></span></div>
      <div class="tprog"><div>T-012 <b id="tpct">0%</b> · <span id="tstage"></span></div><div class="bar" id="tbar"><i style="width:0%"></i></div></div>
      <div class="step-no" id="stepno"></div>
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="who" id="who"></div>
      <div class="cmd" id="cmd"></div>
      <div class="ctl">
        <button id="prev" aria-label="Previous step">◀</button>
        <button id="play" class="primary">Play</button>
        <button id="next" aria-label="Next step">▶</button>
        <button id="restart">Restart</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </div>
  <div class="lower">
    <div class="panel"><p class="sec-title">Task board</p><div class="board" id="board"></div></div>
    <div class="panel"><p class="sec-title">Files the team produced</p><ul class="files" id="files"></ul></div>
  </div>
</div>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const M=[ // id, name, colour, desk
 {id:'planner',n:'Architect',c:'#6a5ae0',d:[1.6,2.0]},
 {id:'analyst',n:'Analyst',c:'#f2a33a',d:[3.8,2.0]},
 {id:'admin',n:'Admin',c:'#12a37c',d:[6.0,2.0]},
 {id:'developer',n:'Developer',c:'#2f86e8',d:[1.6,5.0]},
 {id:'qa',n:'QA',c:'#e0559a',d:[3.8,5.0]},
 {id:'reviewer',n:'Reviewer',c:'#6b7a90',d:[6.0,5.0]}];
const COL=Object.fromEntries(M.map(m=>[m.id,m.c])); COL.jimmy='#e0a000';
const NAME=Object.fromEntries(M.map(m=>[m.id,m.n])); NAME.jimmy='Jimmy';
const DOT={working:'#2e9d57',blocked:'#e5243b',idle:'#a0a8b5',waiting:'#f5b301',done:'#2f86e8'};

/* ---------- palettes + day cycle ---------- */
const PAL={
 sunrise:{sky:['#ff9e80','#ffe2c2'],cloud:'#fff8f1',cloudFar:'#ffffff',wallA:'#fff3e8',wallB:'#f7e2d1',floor:'#fffaf5',grid:'#f4e6d8',rug:'#ffe6d8',deskT:'#f6d2a9',deskL:'#e3b585',deskR:'#d2a275',mon:'#3a2b45',screen:'#ffb26b',win:['#ff9e80','#ffe2c2'],ink:'#43263a',sub:'#8a6a72',accent:'#e0663d',jim:'#fff1c9',vault:'#ffe0cf',moon:'#fff3d6',plant:'#5aa86b',starA:0,lampA:0,orbX:60,orbY:150,orbR:30,orbA:.95,dark:0},
 mint:{sky:['#5cc9b5','#e6faf4'],cloud:'#ffffff',cloudFar:'#ffffff',wallA:'#f2fbf7',wallB:'#dcf1e8',floor:'#fbfffd',grid:'#e3f3ec',rug:'#dcf4ea',deskT:'#ffffff',deskL:'#d2eadf',deskR:'#bddcd0',mon:'#1f3d3a',screen:'#6fe3c8',win:['#5cc9b5','#e6faf4'],ink:'#173b36',sub:'#5b7a74',accent:'#0f8a6c',jim:'#fff5cf',vault:'#d5efe6',moon:'#ffffff',plant:'#3f9d6a',starA:0,lampA:0,orbX:300,orbY:30,orbR:16,orbA:0,dark:0},
 twilight:{sky:['#2a215f','#9a6fd0'],cloud:'#efe8ff',cloudFar:'#d9ccff',wallA:'#f4f0ff',wallB:'#e1d8fb',floor:'#fbf9ff',grid:'#ece6fb',rug:'#ece4ff',deskT:'#ffffff',deskL:'#ddd3f8',deskR:'#cbbdf2',mon:'#2a2350',screen:'#b99cff',win:['#3a2f7a','#d9a0d6'],ink:'#2a2350',sub:'#6d6390',accent:'#7a56e6',jim:'#fff2c4',vault:'#d9ccff',moon:'#fff4d1',plant:'#58a77a',starA:.8,lampA:.3,orbX:52,orbY:44,orbR:13,orbA:.9,dark:0},
 night:{sky:['#0b1030','#26326a'],cloud:'#3b4680',cloudFar:'#2e3870',wallA:'#2b3460',wallB:'#232b52',floor:'#323c6b',grid:'#2b3460',rug:'#3b4880',deskT:'#c79a6c',deskL:'#a57a52',deskR:'#8f6844',mon:'#111531',screen:'#ffd56b',win:['#0b1030','#3a4a90'],ink:'#1d2340',sub:'#5f6788',accent:'#ffd56b',jim:'#5b4a2a',vault:'#2e3870',moon:'#fff1c2',plant:'#4c9a6c',starA:1,lampA:1,orbX:52,orbY:44,orbR:13,orbA:.95,dark:1}};
const K=[[0,'night'],[5,'night'],[7,'sunrise'],[9.5,'sunrise'],[10.5,'mint'],[16.5,'mint'],[17.5,'twilight'],[19.5,'twilight'],[21,'night'],[24,'night']];
const LABEL={night:'Night shift',sunrise:'Sunrise',mint:'Mint morning',twilight:'Twilight'};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const toHex=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>toHex(hex(a).map((v,i)=>v+(hex(b)[i]-v)*t));
function moodAt(h){for(let i=0;i<K.length-1;i++){const[a,ka]=K[i],[b,kb]=K[i+1];if(h>=a&&h<=b){const t=b===a?0:(h-a)/(b-a),A=PAL[ka],B=PAL[kb],o={};
  for(const k in A){const x=A[k],y=B[k];if(typeof x==='string')o[k]=mix(x,y,t);else if(Array.isArray(x))o[k]=x.map((v,j)=>mix(v,y[j],t));else o[k]=x+(y-x)*t;}
  o.dark=o.dark>.5;return[o,LABEL[t<.5?ka:kb]];}}}

/* ---------- scene ---------- */
const U=22,ox=182,oy=96,H=330;
const P=(x,y,z=0)=>[ox+(x-y)*U*.866,oy+(x+y)*U*.5-z*U];
const pts=a=>a.map(q=>q.join(',')).join(' ');
const poly=(a,f,ex='')=>`<polygon points="${pts(a)}" fill="${f}" ${ex}/>`;
const box=(x,y,z,w,d,h,t,l,r)=>poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],t)+poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],l)+poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],r);
const cloud=(cx,cy,s,f,op=1)=>`<g transform="translate(${cx},${cy}) scale(${s})" opacity="${op}"><circle cx="-14" cy="2" r="10" fill="${f}"/><circle cx="0" cy="-5" r="14" fill="${f}"/><circle cx="15" cy="0" r="11" fill="${f}"/><rect x="-24" y="0" width="50" height="12" rx="6" fill="${f}"/></g>`;
const person=(x,y,col,anim)=>{const[sx,sy]=P(x,y,.45);return `<g class="${anim}" style="transform-box:fill-box"><rect x="${sx-7}" y="${sy-18}" width="14" height="17" rx="6" fill="${col}"/><circle cx="${sx}" cy="${sy-24}" r="6" fill="#f3c9a8"/><path d="M${sx-6} ${sy-25} a6 6 0 0 1 12 0 z" fill="#2a2f45"/></g>`;};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function chip(sx,sy,name,st,t,p){const w=Math.max(name.length*1.15,t.length)*3.3+16;
  return `<g transform="translate(${sx-w/2},${sy-52})"><circle cx="${w*.3}" cy="2" r="6" fill="#fff"/><circle cx="${w*.55}" cy="0" r="7.5" fill="#fff"/><rect width="${w}" height="17" rx="8.5" fill="#fff" stroke="${p.ink}" stroke-opacity=".15" stroke-width=".7"/><circle cx="7.5" cy="6.5" r="2.4" fill="${DOT[st]}" ${st==='blocked'?'class="blink"':''}/><text x="12" y="8.5" font-size="6" font-weight="700" fill="#1d2340">${esc(name)}</text><text x="7.5" y="14.2" font-size="5" fill="#5d6176">${esc(t)}</text></g>`;}
const front=id=>{if(id==='jimmy')return P(8.0,6.3);const m=M.find(x=>x.id===id);return P(m.d[0]+.75,m.d[1]+1.25);};
const deskTop=id=>{if(id==='jimmy')return P(9.6,5.7,.7);const m=M.find(x=>x.id===id);return P(m.d[0]+.75,m.d[1]+.4,.7);};
const SANDBOX=[352,64],VAULT=[357,252];

function screen(x,y,S,col){
 const[e,f]=P(x+.4,y+.18,.62);const cid='scr'+Math.random().toString(36).slice(2,8);
 const bg={working:mix('#0b1020',col,.3),blocked:'#6a0f1d',waiting:'#4d3704',done:'#0e4026',idle:'#151b2f'}[S]||'#151b2f';
 let g=`<g transform="matrix(${U*.866},${U*.5},0,${-U},${e},${f})"><clipPath id="${cid}"><rect x=".04" y=".05" width=".62" height=".4"/></clipPath><rect x=".04" y=".05" width=".62" height=".4" fill="${bg}"/><g clip-path="url(#${cid})">`;
 if(S==='working'){g+=`<g><animateTransform attributeName="transform" type="translate" values="0 0;0 .12" dur=".9s" repeatCount="indefinite"/>`;
   const W=[.3,.42,.22,.36,.18,.4,.26,.34,.2,.3],I=[0,.04,.04,.08,.04,0,.04,.08,0,.04];
   for(let k=0;k<10;k++){const v=-.14+k*.06;g+=`<rect x="${.08+I[k]}" y="${v}" width="${W[k]}" height=".024" fill="${k%3===1?'#ffffff':col}" opacity="${k%3===1?.9:1}"/>`;}
   g+='</g>';}
 else if(S==='blocked'){g+=`<g class="blink"><rect x=".33" y=".17" width=".05" height=".2" fill="#fff"/><rect x=".33" y=".09" width=".05" height=".05" fill="#fff"/></g>`;}
 else if(S==='waiting'){[.23,.35,.47].forEach((u,k)=>{g+=`<circle cx="${u}" cy=".25" r=".03" fill="#ffd56b"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin="${k*.3}s" repeatCount="indefinite"/></circle>`;});}
 else if(S==='done'){g+=`<polyline points=".22,.26 .31,.15 .5,.36" fill="none" stroke="#8ff0b5" stroke-width=".045" stroke-linecap="round" stroke-linejoin="round"/>`;}
 else {g+=`<circle cx=".1" cy=".12" r=".025" fill="#5b6aa8"><animate attributeName="cx" values=".1;.6;.1" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values=".1;.4;.1" dur="4.4s" repeatCount="indefinite"/></circle>`;}
 g+=`</g><polygon points=".04,.45 .34,.45 .2,.05 .04,.05" fill="#fff" opacity=".07"/></g>`;
 return g;}
function render(st,p){
 let s=`<svg viewBox="0 0 400 ${H}" xmlns="${NS}"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.sky[0]}"/><stop offset="1" stop-color="${p.sky[1]}"/></linearGradient><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.win[0]}"/><stop offset="1" stop-color="${p.win[1]}"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>${Object.entries({...COL,red:'#ff3b55',amber:'#ffb900'}).map(([k,c])=>`<radialGradient id="g-${k}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${c}" stop-opacity=".75"/><stop offset=".6" stop-color="${c}" stop-opacity=".25"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`).join('')}</defs><rect width="400" height="${H}" fill="url(#sky)"/>`;
 if(p.starA>.02){s+=`<g opacity="${p.starA}">`;for(let i=0;i<34;i++){s+=`<circle cx="${(i*97)%400}" cy="${(i*53)%150}" r="${i%5?.7:1.2}" fill="#fff" class="${i%3?'':'twinkle'}"/>`;}s+='</g>';}
 s+=`<circle cx="${p.orbY<100?150:p.orbX}" cy="${p.orbY<100?24:p.orbY}" r="${p.orbR}" fill="${p.moon}" opacity="${p.orbA}"/>`;
 s+=`<g class="drift">${cloud(40,40,1,p.cloudFar,.7)}</g><g class="drift" style="animation-delay:-14s">${cloud(40,90,.7,p.cloudFar,.55)}</g>`;
 [[0,8],[3,8.6],[6,8.8],[9,8.4],[11.4,6],[11.6,3],[11.2,.5]].forEach(([x,y],i)=>{const q=P(x,y);s+=`<ellipse cx="${q[0]}" cy="${q[1]+12}" rx="${34+i%2*8}" ry="18" fill="${p.cloud}"/>`;});
 const pc=P(5,8.8);s+=`<ellipse cx="${pc[0]+10}" cy="${pc[1]+2}" rx="150" ry="26" fill="${p.cloud}"/>`;
 s+=poly([P(0,0),P(11,0),P(11,0,3.2),P(0,0,3.2)],p.wallA)+poly([P(0,0),P(0,8),P(0,8,3.2),P(0,0,3.2)],p.wallB);
 for(let i=0;i<3;i++){s+=poly([P(1.2+i*2.6,0,1.1),P(2.8+i*2.6,0,1.1),P(2.8+i*2.6,0,2.7),P(1.2+i*2.6,0,2.7)],'url(#win)');const m=P(2+i*2.6,0,2.1);s+=cloud(m[0],m[1]+2,.32,p.cloudFar,.9);}
 s+=poly([P(0,0),P(11,0),P(11,8),P(0,8)],p.floor);
 for(let i=1;i<11;i++)s+=`<line x1="${P(i,0)[0]}" y1="${P(i,0)[1]}" x2="${P(i,8)[0]}" y2="${P(i,8)[1]}" stroke="${p.grid}" stroke-width=".8"/>`;
 s+=poly([P(1,1.1),P(7.4,1.1),P(7.4,7),P(1,7)],p.rug);
 s+=poly([P(8.3,4.6),P(10.7,4.6),P(10.7,7.7),P(8.3,7.7)],p.jim)+poly([P(8.3,4.6),P(8.3,7.7),P(8.3,7.7,2.2),P(8.3,4.6,2.2)],'#ffe58a44','stroke="#e5b800" stroke-width="1"');
 const away=new Set(); let clipN=0;
 if(st.sign||st.jimmyBusy){const g=P(9.65,5.75,0);s+=`<ellipse cx="${g[0]}" cy="${g[1]}" rx="44" ry="25" fill="url(#g-amber)" class="${st.sign?'pulse-slow':'pulse'}"/>`;}
 s+=box(9,5.4,0,1.3,.7,.65,st.sign||st.jimmyBusy?mix(p.deskT,'#ffb900',.3):p.deskT,p.deskL,p.deskR)+(away.has('jimmy')?'':person(9.5,5.0,'#ffb900',st.jimmyBusy?'typing':''));
 if(st.deskParcel){const d=deskTop('jimmy');s+=`<g class="pop"><rect x="${d[0]-7}" y="${d[1]-9}" width="14" height="11" rx="2" fill="#ffb900" stroke="#2a2f45" stroke-width=".8"/><line x1="${d[0]-7}" y1="${d[1]-4}" x2="${d[0]+7}" y2="${d[1]-4}" stroke="#2a2f45" stroke-width=".7"/></g>`;}
 s+=box(10.2,.4,0,.6,.6,.5,'#c7714c','#a85c3c','#954f33')+`<circle cx="${P(10.5,.7,1.1)[0]}" cy="${P(10.5,.7,1.1)[1]}" r="11" fill="${p.plant}"/>`;
 const chips=[],bubbles=[];
 M.forEach(m=>{const a=st.a[m.id]||['idle','Free'];const[x,y]=m.d;
   if(p.lampA>.02){const g=P(x+.75,y+.4,.7);s+=`<ellipse cx="${g[0]}" cy="${g[1]}" rx="34" ry="20" fill="url(#glow)" opacity="${p.lampA}"/>`;}
   const S=a[0],gid={working:m.id,blocked:'red',waiting:'amber'}[S];

const $=id=>document.getElementById(id);
let i=0,timer=null;
const dots=$('dots');STEPS.forEach((_,k)=>{const b=document.createElement('button');b.setAttribute('aria-label','Step '+(k+1));b.onclick=()=>{stop();go(k);};dots.appendChild(b);});
const COLS=[['todo','To do'],['progress','In progress'],['review','In review'],['done','Done']];
function go(k){
 i=Math.max(0,Math.min(STEPS.length-1,k));const st=STEPS[i];
 const[p,moodName]=moodAt(st.h);
 let sb=null;STEPS.slice(0,i+1).forEach(x=>{if(x.sandbox)sb=x.sandbox;});
 $('stage').innerHTML=render({...st,sandbox:sb},p);
 const hh=Math.floor(st.h),mm=Math.round((st.h-hh)*60);
 $('clk').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
 $('mood').textContent=moodName;
 $('stepno').textContent=`Step ${i+1} of ${STEPS.length}`;
 $('title').textContent=st.title;$('text').textContent=st.text;$('cmd').innerHTML=st.cmd;
 $('who').innerHTML=st.who.map(w=>`<i style="background:${COL[w]}">${NAME[w]}</i>`).join('');
 [...dots.children].forEach((b,k)=>{b.className=k===i?'on':k<i?'done':'';});
 const owner={todo:'Analyst · Architect',progress:'Admin · Developer',review:'QA · Reviewer',done:'Released'}[st.board];
 const prev=go.prev??st.pct;go.prev=st.pct;
 const bar=(pc,full)=>`<div class="bar${full?' full':''}"><i data-to="${pc}" style="width:${prev}%"></i></div>`;
 $('board').innerHTML=COLS.map(([id,name])=>`<div class="col"><h3>${name}</h3>${id==='todo'?`<div class="card" style="border-left-color:#c9cbd6"><b>T-013</b>Case escalation email<br><small>Not started</small><div class="pc"><span>Queued</span><b>0%</b></div><div class="bar"><i style="width:0%"></i></div></div>`:''}${st.board===id?`<div class="card"><b>T-012</b>Partner renewal discount<br><small>${owner}</small><div class="pc"><span>${st.stage}</span><b>${st.pct}%</b></div>${bar(st.pct,st.pct===100)}</div>`:''}${id==='done'?'<div class="card" style="border-left-color:#c9cbd6;opacity:.6"><b>T-011</b>Lead routing fix<br><small>Released yesterday</small><div class="pc"><span>Released</span><b>100%</b></div><div class="bar full"><i style="width:100%"></i></div></div>':''}</div>`).join('');
 $('tpct').textContent=st.pct+'%';$('tstage').textContent=st.stage;
 const tb=$('tbar');tb.className='bar'+(st.pct===100?' full':'');tb.firstElementChild.style.width=st.pct+'%';
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#board i[data-to]').forEach(el=>el.style.width=el.dataset.to+'%')));
 const all=[];STEPS.slice(0,i+1).forEach((s,k)=>s.files.forEach(f=>all.push([f,k===i])));
 $('files').innerHTML=all.length?all.map(([f,n])=>`<li class="${n?'new':''}"><i style="background:${n?'var(--accent)':'#c9cbd6'}"></i><span>${f}</span></li>`).join(''):'<li><span>Nothing yet</span></li>';
 $('play').textContent=timer?'Pause':(i===STEPS.length-1?'Replay':'Play');
}
function stop(){clearInterval(timer);timer=null;$('play').textContent='Play';}
function play(){if(i===STEPS.length-1)go(0);timer=setInterval(()=>{if(i>=STEPS.length-1){stop();go(i);return;}go(i+1);},6500);go(i);}
$('play').onclick=()=>timer?stop():play();
$('next').onclick=()=>{stop();go(i+1);};$('prev').onclick=()=>{stop();go(i-1);};$('restart').onclick=()=>{stop();go(0);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(i+1);}if(e.key==='ArrowLeft'){stop();go(i-1);}});
const start=parseInt((location.hash||'').slice(1),10);
go(Number.isFinite(start)?start-1:0);
})();
