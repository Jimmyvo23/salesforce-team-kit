<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salesforce Team Office Mockup</title>
<style>
  body{margin:0;padding:32px max(16px,env(safe-area-inset-left,0px));background:#f3f4f8;color:#1c1d2b;font:16px/1.5 Inter,system-ui,sans-serif}
  h2{font-size:26px;margin:0 0 6px;text-align:center}
  .subtitle{color:#5d6176;max-width:820px;margin:0 auto 20px;text-align:center}
  @media (prefers-reduced-motion: reduce){.typing,.blink,.bob,.drift,.float,.twinkle{animation:none}}
</style>
</head>
<body>
<style>
  .card-image{aspect-ratio:auto !important;display:block !important;padding:0 !important}
  .stage{width:100%;position:relative;border-radius:10px;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  .stage svg{display:block;width:100%;height:auto}
  .typing{animation:type .5s ease-in-out infinite alternate}
  @keyframes type{to{transform:translateY(-1.2px)}}
  .blink{animation:blink 1.4s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  .bob{animation:bob 1.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-2.5px)}}
  .drift{animation:drift 30s linear infinite}
  @keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
  .float{animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-4px)}}
  .twinkle{animation:tw 2.4s ease-in-out infinite}
  @keyframes tw{50%{opacity:.2}}
  .pal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:1rem}
  .sw{display:flex;gap:4px;margin-top:6px}.sw i{width:18px;height:18px;border-radius:5px;border:1px solid #0002}

  .dc{display:grid;gap:12px}
  .dc .stage{max-width:820px;margin:0 auto}
  .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:12px;max-width:820px;margin:0 auto;width:100%}
  .ctl input[type=range]{flex:1;min-width:220px}
  .clock{font:700 22px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;min-width:70px}
  .mood{font-weight:600}
  .ctl button{font:600 13px Inter,system-ui,sans-serif;padding:8px 12px;border-radius:8px;border:1px solid #0003;background:#fff;cursor:pointer}
  .band{max-width:820px;margin:0 auto;width:100%;height:14px;border-radius:7px}
</style>
<h2>The office follows your clock</h2>
<p class="subtitle">Drag the slider through the day, or press "Play a day" to watch 24 hours in about 15 seconds. "Now" jumps to your real time. On the dashboard the change is real time, so a blend takes about an hour.</p>
<div class="dc">
  <div class="stage" id="dcs"></div>
  <div class="band" id="band"></div>
  <div class="ctl">
    <span class="clock" id="clk">--:--</span><span class="mood" id="mood"></span>
    <input type="range" id="t" min="0" max="1439" step="1" value="720" aria-label="Time of day">
    <button id="now">Now</button><button id="play">Play a day</button>
  </div>
</div>
<script>(function(){

const TEAM=[
 {n:'Architect',c:'#6a5ae0',st:'working',t:'Planning WO-7'},
 {n:'Analyst',c:'#f2a33a',st:'working',t:'UAT script'},
 {n:'Admin',c:'#12a37c',st:'working',t:'Renewal flow 60%'},
 {n:'Developer',c:'#2f86e8',st:'blocked',t:'1 Apex test failing'},
 {n:'QA',c:'#e0559a',st:'idle',t:'Waiting for handoff'},
 {n:'Reviewer',c:'#6b7a90',st:'idle',t:'Free'}];
const DOT={working:'#2e9d57',blocked:'#e5243b',idle:'#a0a8b5'};
const NS='http://www.w3.org/2000/svg';
const PAL={
 sunrise:{sky:['#ff9e80','#ffe2c2'],cloud:'#fff8f1',cloudFar:'#ffffff',wallA:'#fff3e8',wallB:'#f7e2d1',floor:'#fffaf5',grid:'#f4e6d8',rug:'#ffe6d8',
   deskT:'#f6d2a9',deskL:'#e3b585',deskR:'#d2a275',mon:'#3a2b45',screen:'#ffb26b',win:['#ff9e80','#ffe2c2'],ink:'#43263a',sub:'#8a6a72',accent:'#e0663d',jim:'#fff1c9',vault:'#ffe0cf',stars:false,moon:'#fff3d6',plant:'#5aa86b'},
 twilight:{sky:['#2a215f','#9a6fd0'],cloud:'#efe8ff',cloudFar:'#d9ccff',wallA:'#f4f0ff',wallB:'#e1d8fb',floor:'#fbf9ff',grid:'#ece6fb',rug:'#ece4ff',
   deskT:'#ffffff',deskL:'#ddd3f8',deskR:'#cbbdf2',mon:'#2a2350',screen:'#b99cff',win:['#3a2f7a','#d9a0d6'],ink:'#2a2350',sub:'#6d6390',accent:'#7a56e6',jim:'#fff2c4',vault:'#d9ccff',stars:true,moon:'#fff4d1',plant:'#58a77a'},
 mint:{sky:['#5cc9b5','#e6faf4'],cloud:'#ffffff',cloudFar:'#ffffff',wallA:'#f2fbf7',wallB:'#dcf1e8',floor:'#fbfffd',grid:'#e3f3ec',rug:'#dcf4ea',
   deskT:'#ffffff',deskL:'#d2eadf',deskR:'#bddcd0',mon:'#1f3d3a',screen:'#6fe3c8',win:['#5cc9b5','#e6faf4'],ink:'#173b36',sub:'#5b7a74',accent:'#0f8a6c',jim:'#fff5cf',vault:'#d5efe6',stars:false,moon:'#ffffff',plant:'#3f9d6a'},
 night:{sky:['#0b1030','#26326a'],cloud:'#3b4680',cloudFar:'#2e3870',wallA:'#2b3460',wallB:'#232b52',floor:'#323c6b',grid:'#2b3460',rug:'#3b4880',
   deskT:'#c79a6c',deskL:'#a57a52',deskR:'#8f6844',mon:'#111531',screen:'#ffd56b',win:['#0b1030','#3a4a90'],ink:'#1d2340',sub:'#5f6788',accent:'#ffd56b',jim:'#5b4a2a',vault:'#2e3870',stars:true,moon:'#fff1c2',plant:'#4c9a6c',lamp:true}
};
function cloud(cx,cy,s,fill,op=1){return `<g transform="translate(${cx},${cy}) scale(${s})" opacity="${op}"><circle cx="-14" cy="2" r="10" fill="${fill}"/><circle cx="0" cy="-5" r="14" fill="${fill}"/><circle cx="15" cy="0" r="11" fill="${fill}"/><rect x="-24" y="0" width="50" height="12" rx="6" fill="${fill}"/></g>`;}

function scene(el,key,p){
 p=p||PAL[key]; const U=22, ox=182, oy=96, H=330;
 const P=(x,y,z=0)=>[ox+(x-y)*U*.866, oy+(x+y)*U*.5-z*U];
 const pts=a=>a.map(q=>q.join(',')).join(' ');
 const poly=(a,f,extra='')=>`<polygon points="${pts(a)}" fill="${f}" ${extra}/>`;
 const box=(x,y,z,w,d,h,top,left,right)=>
   poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],top)+
   poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],left)+
   poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],right);
 const person=(x,y,col,anim)=>{const [sx,sy]=P(x,y,0.45);
   return `<g class="${anim}" style="transform-box:fill-box"><rect x="${sx-7}" y="${sy-18}" width="14" height="17" rx="6" fill="${col}"/><circle cx="${sx}" cy="${sy-24}" r="6" fill="#f3c9a8"/><path d="M${sx-6} ${sy-25} a6 6 0 0 1 12 0 z" fill="#2a2f45"/></g>`;};
 const chip=(sx,sy,m)=>{const w=Math.max(m.n.length*1.15,m.t.length)*3.3+16;
   return `<g transform="translate(${sx-w/2},${sy-52})"><circle cx="${w*.3}" cy="2" r="6" fill="#fff"/><circle cx="${w*.55}" cy="0" r="7.5" fill="#fff"/><rect width="${w}" height="17" rx="8.5" fill="#fff" stroke="${p.ink}" stroke-opacity=".15" stroke-width=".7"/><circle cx="7.5" cy="6.5" r="2.4" fill="${DOT[m.st]}" ${m.st==='blocked'?'class="blink"':''}/><text x="12" y="8.5" font-size="6" font-weight="700" fill="${p.ink}">${m.n}</text><text x="7.5" y="14.2" font-size="5" fill="${p.sub}">${m.t}</text></g>`;};
 let s=`<svg viewBox="0 0 400 ${H}" xmlns="${NS}"><defs>
  <linearGradient id="sky-${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.sky[0]}"/><stop offset="1" stop-color="${p.sky[1]}"/></linearGradient>
  <linearGradient id="win-${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.win[0]}"/><stop offset="1" stop-color="${p.win[1]}"/></linearGradient>
  <radialGradient id="glow-${key}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient></defs>
  <rect width="400" height="${H}" fill="url(#sky-${key})"/>`;
 if(p.starA>0.02){ s+=`<g opacity="${p.starA}">`; for(let i=0;i<34;i++){const x=(i*97)%400,y=(i*53)%150,r=i%5?0.7:1.2; s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" class="${i%3?'':'twinkle'}" style="animation-delay:${i%7*.3}s"/>`;} s+='</g>'; }
 s+=`<circle cx="${p.orbX}" cy="${p.orbY}" r="${p.orbR}" fill="${p.moon}" opacity="${p.orbA}"/>`;
 s+=`<g class="drift">${cloud(40,40,1,p.cloudFar,.7)}</g><g class="drift" style="animation-delay:-14s">${cloud(40,90,.7,p.cloudFar,.55)}</g><g class="drift" style="animation-delay:-22s">${cloud(40,20,.5,p.cloudFar,.6)}</g>`;
 const c=[[0,8],[3,8.6],[6,8.8],[9,8.4],[11.4,6],[11.6,3],[11.2,0.5]];
 c.forEach(([x,y],i)=>{const q=P(x,y); s+=`<ellipse cx="${q[0]}" cy="${q[1]+12}" rx="${34+i%2*8}" ry="18" fill="${p.cloud}"/>`;});
 const pc=P(5,8.8); s+=`<ellipse cx="${pc[0]+10}" cy="${pc[1]+2}" rx="150" ry="26" fill="${p.cloud}"/>`;
 s+=poly([P(0,0,0),P(11,0,0),P(11,0,3.2),P(0,0,3.2)],p.wallA);
 s+=poly([P(0,0,0),P(0,8,0),P(0,8,3.2),P(0,0,3.2)],p.wallB);
 for(let i=0;i<3;i++){ s+=poly([P(1.2+i*2.6,0,1.1),P(2.8+i*2.6,0,1.1),P(2.8+i*2.6,0,2.7),P(1.2+i*2.6,0,2.7)],`url(#win-${key})`);
   const m=P(2+i*2.6,0,2.1); s+=cloud(m[0],m[1]+2,.32,p.cloudFar,.9);}
 s+=poly([P(0,0),P(11,0),P(11,8),P(0,8)],p.floor);
 for(let i=1;i<11;i++) s+=`<line x1="${P(i,0)[0]}" y1="${P(i,0)[1]}" x2="${P(i,8)[0]}" y2="${P(i,8)[1]}" stroke="${p.grid}" stroke-width=".8"/>`;
 s+=poly([P(1,1.1),P(7.4,1.1),P(7.4,7),P(1,7)],p.rug);
 s+=poly([P(8.3,4.6),P(10.7,4.6),P(10.7,7.7),P(8.3,7.7)],p.jim);
 s+=poly([P(8.3,4.6,0),P(8.3,7.7,0),P(8.3,7.7,2.2),P(8.3,4.6,2.2)],'#ffe58a44','stroke="#e5b800" stroke-width="1"');
 s+=box(9.0,5.4,0,1.3,0.7,0.65,p.deskT,p.deskL,p.deskR);
 s+=person(9.5,5.0,'#ffb900','');
 s+=box(10.2,0.4,0,0.6,0.6,0.5,'#c7714c','#a85c3c','#954f33')+`<circle cx="${P(10.5,0.7,1.1)[0]}" cy="${P(10.5,0.7,1.1)[1]}" r="11" fill="${p.plant}"/>`;
 const spots=[[1.6,2.0],[3.8,2.0],[6.0,2.0],[1.6,5.0],[3.8,5.0],[6.0,5.0]]; const chips=[];
 spots.forEach(([x,y],i)=>{const m=TEAM[i];
   if(p.lampA>0.02){const g=P(x+0.75,y+0.4,0.7); s+=`<ellipse cx="${g[0]}" cy="${g[1]}" rx="34" ry="20" fill="url(#glow-${key})" opacity="${p.lampA}"/>`;}
   s+=person(x+0.7,y-0.55,m.c,m.st==='working'?'typing':'');
   s+=box(x,y,0,1.5,0.85,0.62,p.deskT,p.deskL,p.deskR);
   s+=box(x+0.45,y+0.1,0.62,0.6,0.08,0.42,p.mon,p.mon,p.mon);
   const g=P(x+0.75,y+0.1,0.83); s+=`<circle cx="${g[0]}" cy="${g[1]}" r="2.5" fill="${m.st==='blocked'?'#e5243b':p.screen}" class="blink"/>`;
   const q=P(x+0.7,y-0.55,0.45); chips.push(chip(q[0],q[1],m));
 });
 const a=P(6.6,3.2),b=P(4.6,4.3);
 s+=`<g><animateMotion dur="5s" repeatCount="indefinite" path="M${a[0]},${a[1]} L${b[0]},${b[1]} L${a[0]},${a[1]}"/><g transform="translate(0,-2)"><rect x="-3" y="-4" width="2.5" height="6" fill="#2a2f45"><animate attributeName="height" values="6;3;6" dur=".4s" repeatCount="indefinite"/></rect><rect x="0.5" y="-4" width="2.5" height="6" fill="#2a2f45"><animate attributeName="height" values="3;6;3" dur=".4s" repeatCount="indefinite"/></rect><rect x="-5" y="-17" width="10" height="13" rx="4" fill="#12a37c"/><circle cx="0" cy="-21" r="4.5" fill="#f3c9a8"/><rect x="3" y="-14" width="7" height="9" fill="#fff" stroke="${p.accent}" stroke-width=".6"/></g></animateMotion></g>`;
 s+=`<g class="float">${cloud(352,52,1.7,p.cloud)}<text x="352" y="50" text-anchor="middle" font-size="6.5" font-weight="700" fill="${p.dark?'#ffffff':p.accent}">UAT sandbox</text><text x="352" y="59" text-anchor="middle" font-size="5.5" fill="${p.dark?'#9be8b4':'#2e844a'}">✓ 142/142 tests · 87%</text></g>`;
 const st=P(6.7,2.2,1.2);
 s+=`<g><animateMotion dur="4s" repeatCount="indefinite" path="M${st[0]},${st[1]} Q${st[0]+40},${st[1]-60} 340,64"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="4s" repeatCount="indefinite"/><rect x="-5" y="-5" width="10" height="9" rx="1.5" fill="#ffb900" stroke="#2a2f45" stroke-width=".7"/><line x1="-5" y1="-1" x2="5" y2="-1" stroke="#2a2f45" stroke-width=".6"/></g>`;
 s+=`<g>${cloud(356,252,1.5,p.vault)}<text x="357" y="253" text-anchor="middle" font-size="6" font-weight="700" fill="${p.dark?'#ffffff':p.ink}">🔒 Production</text><text x="357" y="261" text-anchor="middle" font-size="5" fill="${p.dark?'#c9cfee':p.sub}">only Jimmy opens</text></g>`;
 s+=chips.join('');
 const jp=P(9.6,5,2.3);
 s+=`<g class="bob"><rect x="${jp[0]-30}" y="${jp[1]-15}" width="60" height="15" rx="7.5" fill="#ffb900" stroke="#2a2f45" stroke-width="1"/><text x="${jp[0]}" y="${jp[1]-5}" text-anchor="middle" font-size="6.5" font-weight="700" fill="#2a2f45">Jimmy · WO-7 ✋</text></g>`;
 s+='</svg>'; el.innerHTML=s;
}

const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const toHex=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>toHex(hex(a).map((v,i)=>v+(hex(b)[i]-v)*t));
const N={...PAL.night,starA:1,lampA:1,orbX:52,orbY:44,orbR:13,orbA:.95,dark:1};
const S={...PAL.sunrise,starA:0,lampA:0,orbX:60,orbY:150,orbR:30,orbA:.95,dark:0};
const M={...PAL.mint,starA:0,lampA:0,orbX:300,orbY:30,orbR:16,orbA:.0,dark:0};
const T={...PAL.twilight,starA:.8,lampA:.3,orbX:52,orbY:44,orbR:13,orbA:.9,dark:0};
// keyframes in hours
const K=[[0,N,'Night shift'],[5,N,'Night shift'],[7,S,'Sunrise'],[9.5,S,'Sunrise'],[10.5,M,'Mint morning'],[16.5,M,'Mint morning'],[17.5,T,'Twilight'],[19.5,T,'Twilight'],[21,N,'Night shift'],[24,N,'Night shift']];
function at(h){for(let i=0;i<K.length-1;i++){const[a,A,na]=K[i],[b,B,nb]=K[i+1]; if(h>=a&&h<=b){const t=b===a?0:(h-a)/(b-a); const o={};
  for(const k in A){const x=A[k],y=B[k]; if(typeof x==='string'&&x[0]==='#')o[k]=mix(x,y,t); else if(Array.isArray(x))o[k]=x.map((v,j)=>mix(v,y[j],t)); else if(typeof x==='number')o[k]=x+(y-x)*t; else o[k]=t<.5?x:y;}
  o.dark=(A.dark+(B.dark-A.dark)*t)>.5; return [o,t<.5?na:nb,t>0&&t<1&&na!==nb?' (blending)':''];}}}
const el=document.getElementById('dcs'),r=document.getElementById('t');
function draw(min){const h=min/60,[p,name,bl]=at(h); scene(el,'dc',p);
  document.getElementById('clk').textContent=String(Math.floor(h)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
  document.getElementById('mood').textContent=name+bl;}
// band of the whole day
const stops=[];for(let m=0;m<=1440;m+=60){stops.push(at(m/60)[0].sky[1]+' '+(m/1440*100).toFixed(1)+'%');}
document.getElementById('band').style.background='linear-gradient(90deg,'+stops.join(',')+')';
r.oninput=()=>draw(+r.value);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
document.getElementById('now').onclick=()=>{r.value=nowMin();draw(+r.value);};
let playing=null;document.getElementById('play').onclick=()=>{if(playing){clearInterval(playing);playing=null;return;}
  playing=setInterval(()=>{r.value=(+r.value+10)%1440;draw(+r.value);},100);};
r.value=nowMin();draw(+r.value);
})();</script>

</body>
</html>
